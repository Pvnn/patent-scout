[project]
name = "patentscout"
version = "0.1.0"
description = "AI-Powered Patent Research & Prior-Art Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "agno",
    "openai",
    "faiss-cpu",
    "sqlalchemy",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest"
]

[tool.setuptools]
packages = ["agents", "workflows", "tools", "scripts"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
